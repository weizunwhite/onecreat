name: CI

on:
  push:
    branches: [main-v2]
  pull_request:
    # **有意不加 `branches:` 过滤。**
    #
    # 这里原来按 base 分支过滤,而这个过滤器已经**两次**静默吞掉整条矩阵:
    #
    #   1. 名单只有 [main-v2] 时,栈式 refactor/* PR 一个 job 都不跑 —— Plan 01 补了
    #      "refactor/**";
    #   2. 名单是 [main-v2, refactor/**, fix/**] 时,base 为 `test/*` 或 `docs/*` 的
    #      PR 又只跑 `label`。2026-08-21 的整改栈里 #25 / #28 / #32 三个 PR 因此从头到尾
    #      **没有被矩阵跑过一次**,而它们的 checks 看起来是有的。
    #
    # 两次都不是过滤器写错,是"每加一个分支前缀就要记得回来改一行"这件事本身不成立 ——
    # 而它失败的方式恰恰最坏:**不是红,是看起来什么都没发生**。红 CI 会被人追问,
    # 缺席的 CI 不会。
    #
    # 所以这次不加第三个前缀,直接去掉过滤器:任何 PR 都跑完整矩阵。代价是几分钟的
    # runner 时间,换掉一整类"以为验证过其实没有"。要重新收紧,必须先想清楚怎么让
    # 遗漏是**可见**的。
  # 手动重跑入口。2026-08-20 的 runner 分配故障(见 docs/架构重构执行总计划.md
  # §19.5)暴露了一个真实缺口:整个 matrix 因基础设施原因全红时,没有 rerun 权限
  # 的一方只能靠推提交来换一次新 run —— 而「为撞 CI 推空提交」是本项目的红线。
  # 有了 workflow_dispatch,基础设施恢复后可以直接对同一个 commit 重跑,拿到干净
  # 的验收证据。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Skipped on Windows: the runner checks out CRLF, so gofmt -l flags every
      # file. gofmt output is OS-independent, so the Unix legs already cover it.
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          # Root module only — desktop/ is a separate module with its own tooling.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage.
      - name: test -race
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./...

  desktop:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      # The Go main package embeds frontend/dist; a placeholder lets the Go
      # build/test resolve the embed without a full frontend build.
      - name: Stub embedded frontend
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci</title>' > frontend/dist/index.html

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "desktop/go.mod or go.sum is stale - run 'cd desktop && go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      # WebKitGTK 4.0 toolchain (pinned to ubuntu-22.04; no webkit2_41 tag).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # Frontend 之前完全不在 CI 里(复核 AR-R13.2):desktop job 只写一个
  # frontend/dist/index.html 占位就跑 Go。于是 Go↔TS 的方法生成守卫虽然存在,
  # **TS 调用、数据类型和真实 bundle 仍然可以在 CI 之外坏掉** —— 桌面/Web 两个
  # 前端的运行时错误一个都不会被这条流水线发现。
  #
  # 单独一个 job,不塞进 desktop:那一条要装 WebKit 工具链,已经够慢了;而且分开之后
  # "Go 坏了" 与 "TS 坏了" 一眼就能区分。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      # --frozen-lockfile:lockfile 与 package.json 不一致时直接失败,而不是悄悄
      # 装一个和开发机不同的依赖树。
      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm tsc --noEmit

      # 真正打一次包:tsc 过了不代表 bundle 出得来(缺资源、循环依赖、插件报错都在
      # 这一步才暴露)。
      - name: build
        run: pnpm build
