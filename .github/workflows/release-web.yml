name: Release web

# Web 模式(主分发形态)发布线。tag 命名空间 `web-v<semver>` 触发:
#   git tag web-vX.Y.Z && git push origin web-vX.Y.Z
# 纯 Go + 内嵌前端,不需要 Wails/WebKit/NSIS,所以单个 ubuntu runner 交叉编译全平台即可
# (对比 release-desktop.yml 需要逐平台原生 runner)。产物由 scripts/web-build.sh 生成。
# `v*` 是 CLI 发布(release.yml),`desktop-v*` 是 Wails 桌面版(release-desktop.yml,已降为可选)。
on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag(如 web-v1.2.0),手动触发时必填"
        required: true
        type: string

permissions:
  contents: write # 建 release、传产物

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache hit guard
        run: ./scripts/cache-guard.sh

      - name: Build all platforms and package
        env:
          # latest.json 里的下载链接基址(阿里云 nginx /var/www/onecreat,大陆直连;GitHub Releases 是镜像)
          RELEASE_BASE_URL: http://47.95.176.214/onecreat
        run: ./scripts/web-build.sh all "$VERSION"

      # 上传到阿里云下载站:专用用户 onecreat-release 只对 /var/www/onecreat 有写权限。
      # 先传包,再传 SHA256SUMS,最后才覆盖 latest.json —— 客户端看到新版本号时包一定已就位。
      - name: Upload to Aliyun download site
        env:
          SSH_KEY: ${{ secrets.ONECREAT_RELEASE_SSH_KEY }}
          HOST: ${{ secrets.ONECREAT_RELEASE_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_key && chmod 600 ~/.ssh/release_key
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/release_key -o StrictHostKeyChecking=yes onecreat-release@$HOST"
          SCP="scp -i ~/.ssh/release_key -o StrictHostKeyChecking=yes"
          $SSH "mkdir -p /var/www/onecreat/$VERSION"
          $SCP dist/onecreat-web-*.tar.gz dist/onecreat-web-*.zip dist/SHA256SUMS "onecreat-release@$HOST:/var/www/onecreat/$VERSION/"
          if [ -f dist/latest.json ]; then
            $SCP dist/latest.json "onecreat-release@$HOST:/var/www/onecreat/latest.json"
          fi
          $SSH "ls -la /var/www/onecreat/$VERSION"

      - name: Publish GitHub release
        run: |
          gh release create "$VERSION" \
            dist/SHA256SUMS dist/onecreat-web-*.tar.gz dist/onecreat-web-*.zip \
            --title "OneCreat $VERSION (Web)" \
            --generate-notes
